[project]
name = "auto-equity-agent"
version = "0.2.0"
description = "Agente que opera Elegibilidad, Perfilamiento, Simulacion y Documentos de Auto Equity"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6,<7",
    "pymongo>=4.9,<5",
    "httpx>=0.27",
    "langgraph>=1.2,<1.3",
]

[project.optional-dependencies]
checkpointer-mongo = ["langgraph-checkpoint-mongodb>=0.5,<1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mongomock>=4.2",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.checkpoint.mongodb"]
ignore_missing_imports = true   # extra opcional: checkpointer-mongo

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: evaluacion offline con set adversarial"]

[tool.setuptools]
packages = []
