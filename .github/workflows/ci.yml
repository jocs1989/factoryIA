name: ci

on:
  push:
    branches: [main]
  pull_request:

# Minimo privilegio: el workflow solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tipos, SAST, docstrings, tests y evaluación
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      # Sin red ni credenciales: todo corre en modo mock.
      - run: make lint
      - run: make types
      - name: SAST (bandit)
        run: make sast
      - name: Documentación de la superficie pública
        run: make docstrings
      - run: make mocks-validate
      - run: make test
      # Set etiquetado + fuzzing + un LLM caótico: falla ante un falso OK.
      - run: make eval

  integration:
    name: integración con MongoDB real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - run: make integration
        env:
          MONGO_URI: mongodb://localhost:27017

  smoke:
    name: pila completa con Docker y prueba de humo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Construye y levanta api, mocks, mongo e interfaz
        # --wait espera a los healthchecks; falla si algún servicio no queda sano.
        run: docker compose up --build -d --wait
      - name: La imagen corre sin privilegios y con sistema de solo lectura
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          ! docker compose exec -T api touch /app/escritura-prohibida
      - name: Conversación completa por HTTP
        run: uv run --with httpx python -m scripts.smoke_http --base http://localhost:8000 --key demo-canal-no-usar-en-prod
      - name: La interfaz sirve y reenvía a la API
        run: curl -sf http://localhost:8080/api/health
      - name: Logs si falló
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()

  dependencias:
    name: auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativa: una CVE nueva no debe bloquear un cambio ajeno.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv export --frozen --no-dev --no-hashes --format requirements-txt -o requirements.txt
      - run: uvx pip-audit -r requirements.txt
